; Materials attachments go up to 95MB a file (⚡customer-detail's
; MATERIALS_FILE_RULES, Livewire's temporary upload rule in
; AppServiceProvider) — just under Cloudflare's 100MB request limit; nginx
; (docker/nginx/default.conf and the host vhost) allows 100M. PHP's defaults
; (2M / 8M) silently dropped anything bigger, so the file never reached
; Livewire and sending said none was attached.
upload_max_filesize = 95M
post_max_size = 110M
max_file_uploads = 20
