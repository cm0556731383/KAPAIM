; Materials attachments go up to 25MB a file (⚡customer-detail's
; MATERIALS_FILE_RULES, Livewire's temporary upload rule in
; AppServiceProvider). PHP's defaults (2M / 8M) silently dropped anything
; bigger, so the file never reached Livewire and sending said none was attached.
upload_max_filesize = 25M
post_max_size = 110M
max_file_uploads = 20
