server {

    listen 80;

    server_name _;

    root /var/www/html/public;

    index index.php;

    charset utf-8;

    client_max_body_size 100M;

    # Browser security headers: no embedding the CRM in another site
    # (clickjacking), no MIME sniffing, HTTPS-only once seen over HTTPS
    # (ignored on plain-http 127.0.0.1), and no full URLs (signed links)
    # leaked to other sites in Referer.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }

    location = /favicon.ico {

        access_log off;

        log_not_found off;

    }

    location = /robots.txt {

        access_log off;

        log_not_found off;

    }

    location ~ \.php$ {

        try_files $uri =404;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_pass app:9000;

        fastcgi_read_timeout 120;

        # Don't advertise the PHP version.
        fastcgi_hide_header X-Powered-By;

    }

    location ~ /\.(?!well-known).* {

        deny all;

    }

}
