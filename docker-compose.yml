# Settings come from .env (see .env.example): APP_PORT, APP_UID/APP_GID,
# CONTAINER_PREFIX and the DB_* values. Full install steps: DEPLOY.md.
services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ${CONTAINER_PREFIX:-crm}_app

    restart: unless-stopped

    working_dir: /var/www/html

    user: "${APP_UID:-1001}:${APP_GID:-1001}"

    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


  nginx:
    image: nginx:1.29-alpine

    container_name: ${CONTAINER_PREFIX:-crm}_nginx

    restart: unless-stopped

    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - crm


  postgres:
    image: postgres:18-alpine

    container_name: ${CONTAINER_PREFIX:-crm}_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 10s

    networks:
      - crm


  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ${CONTAINER_PREFIX:-crm}_queue

    restart: unless-stopped

    working_dir: /var/www/html

    user: "${APP_UID:-1001}:${APP_GID:-1001}"

    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=120",
        "--max-time=3600"
      ]

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ${CONTAINER_PREFIX:-crm}_scheduler

    restart: unless-stopped

    working_dir: /var/www/html

    user: "${APP_UID:-1001}:${APP_GID:-1001}"

    command:
      [
        "sh",
        "-c",
        "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
      ]

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


  # Builds the CSS/JS into public/build — run on install and after every
  # update that touches resources/ (install.sh / update.sh do it):
  #   docker compose run --rm assets
  assets:
    image: node:22-alpine

    profiles: ["tools"]

    working_dir: /var/www/html

    user: "${APP_UID:-1001}:${APP_GID:-1001}"

    environment:
      HOME: /tmp

    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]

    volumes:
      - ./:/var/www/html


volumes:

  postgres_data:
    driver: local


networks:

  crm:
    driver: bridge
