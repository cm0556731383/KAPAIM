services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: crm_app

    restart: unless-stopped

    working_dir: /var/www/html

    user: "1001:1001"

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


  nginx:
    image: nginx:1.29-alpine

    container_name: crm_nginx

    restart: unless-stopped

    ports:
      - "127.0.0.1:8090:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - crm


  postgres:
    image: postgres:18-alpine

    container_name: crm_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 10s

    networks:
      - crm


  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: crm_queue

    restart: unless-stopped

    working_dir: /var/www/html

    user: "1001:1001"

    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--sleep=3",
        "--tries=3",
        "--timeout=120",
        "--max-time=3600"
      ]

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: crm_scheduler

    restart: unless-stopped

    working_dir: /var/www/html

    user: "1001:1001"

    command:
      [
        "sh",
        "-c",
        "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
      ]

    volumes:
      - ./:/var/www/html

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - crm


volumes:

  postgres_data:
    driver: local


networks:

  crm:
    driver: bridge
